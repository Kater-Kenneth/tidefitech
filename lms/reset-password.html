<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Set New Password | TIDEF ITECH LMS</title>
    <link
      rel="icon"
      href="https://www.tidefitech.com/img/Capture-removebg-preview.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-visual">
        <div class="brand">
          <img
            src="https://www.tidefitech.com/img/Capture-removebg-preview.png"
            alt="TIDEF ITECH"
          />
          <span class="brand-name">TIDEF ITECH LMS</span>
        </div>
        <div>
          <h2>Choose a strong new password.</h2>
          <p>Use at least 8 characters. You'll be signed in right after.</p>
        </div>
        <p style="font-size: 0.82rem">
          © 2026 TIDEF ITECH — Makurdi, Benue State
        </p>
      </div>

      <div class="auth-form-side">
        <div class="auth-form-wrap">
          <div class="eyebrow">VERIFY & NEW PASSWORD</div>
          <h1>Reset your password</h1>
          <p class="sub" id="sub-text">
            Enter the code we sent to your email, then choose a new password.
          </p>

          <div id="form-alert"></div>

          <div id="otp-panel">
            <div class="field">
              <label for="email">Email address</label>
              <input
                class="input"
                type="email"
                id="email"
                required
                autocomplete="email"
              />
            </div>
            <div class="field">
              <label for="otp">Verification code</label>
              <input
                class="input"
                id="otp"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="8"
                placeholder="Enter 6-digit code"
              />
            </div>
            <button class="btn btn-primary btn-block" id="verify-btn">
              Verify code
            </button>
          </div>

          <form id="reset-form" novalidate class="hidden">
            <div class="field">
              <label for="password">New password</label>
              <input
                class="input"
                type="password"
                id="password"
                required
                minlength="8"
                autocomplete="new-password"
              />
            </div>
            <div class="field">
              <label for="confirmPassword">Confirm new password</label>
              <input
                class="input"
                type="password"
                id="confirmPassword"
                required
                minlength="8"
                autocomplete="new-password"
              />
            </div>
            <button
              type="submit"
              class="btn btn-primary btn-block"
              id="reset-btn"
            >
              Set New Password
            </button>
          </form>

          <p class="switch-link">
            <a href="./login.html">&larr; Back to log in</a>
          </p>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        setNewPassword,
        getUserProfile,
        getFreshUser,
        verifyPasswordResetOtp,
      } from "./js/auth.js";
      import { ROLE_HOME_PAGE } from "./js/config.js";
      import {
        setButtonLoading,
        setFieldError,
        clearFieldError,
      } from "./js/utils.js";

      const form = document.getElementById("reset-form");
      const otpPanel = document.getElementById("otp-panel");
      const alertBox = document.getElementById("form-alert");
      const resetBtn = document.getElementById("reset-btn");
      const verifyBtn = document.getElementById("verify-btn");
      const subText = document.getElementById("sub-text");
      const emailField = document.getElementById("email");
      const otpField = document.getElementById("otp");

      const params = new URLSearchParams(window.location.search);
      const identifier = params.get("identifier") || "";
      if (identifier) {
        emailField.value = identifier;
      }

      async function finishReset(user) {
        const profile = await getUserProfile(user.id);
        alertBox.innerHTML = `<div class="alert alert-success">Password updated! Redirecting…</div>`;
        setTimeout(() => {
          if (
            profile?.role === "student" &&
            profile.account_status !== "approved"
          ) {
            window.location.href = "./student/pending-approval.html";
          } else {
            window.location.href =
              ROLE_HOME_PAGE[profile?.role] || "./student/dashboard.html";
          }
        }, 1200);
      }

      (async () => {
        const user = await getFreshUser();
        if (user) {
          otpPanel.classList.add("hidden");
          form.classList.remove("hidden");
          subText.textContent =
            "Your email has been verified. Enter a new password below.";
        }
      })();

      verifyBtn.addEventListener("click", async () => {
        const email = emailField.value.trim();
        const token = otpField.value.trim();
        alertBox.innerHTML = "";

        if (!email || !token) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">Enter your email and the verification code.</div>';
          return;
        }

        setButtonLoading(verifyBtn, true, "Verifying…");
        try {
          const user = await verifyPasswordResetOtp(email, token);
          otpPanel.classList.add("hidden");
          form.classList.remove("hidden");
          subText.textContent =
            "Your email is verified. Choose a strong new password.";
          alertBox.innerHTML = `<div class="alert alert-success">Code verified. Create your new password.</div>`;
          if (user) {
            await getFreshUser();
          }
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-danger">${err.message || "That code is invalid or expired. Request a new one and try again."}</div>`;
        } finally {
          setButtonLoading(verifyBtn, false);
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.innerHTML = "";
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        clearFieldError(password);
        clearFieldError(confirmPassword);

        if (password.value.length < 8) {
          setFieldError(password, "Use at least 8 characters.");
          return;
        }
        if (password.value !== confirmPassword.value) {
          setFieldError(confirmPassword, "Passwords don't match.");
          return;
        }

        setButtonLoading(resetBtn, true, "Saving…");
        try {
          await setNewPassword(password.value);
          const user = await getFreshUser();
          if (!user) {
            throw new Error(
              "Your session expired before the password update completed.",
            );
          }
          await finishReset(user);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-danger">${err.message || "Couldn't update your password. Request a new code and try again."}</div>`;
          setButtonLoading(resetBtn, false);
        }
      });
    </script>
  </body>
</html>
