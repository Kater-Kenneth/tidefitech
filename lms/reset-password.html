<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Set New Password | TIDEF ITECH LMS</title>
    <link
      rel="icon"
      href="https://www.tidefitech.com/img/Capture-removebg-preview.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-visual">
        <div class="brand">
          <img
            src="https://www.tidefitech.com/img/Capture-removebg-preview.png"
            alt="TIDEF ITECH"
          />
          <span class="brand-name">TIDEF ITECH LMS</span>
        </div>
        <div>
          <h2>Choose a strong new password.</h2>
          <p>Use at least 8 characters. You'll be signed in right after.</p>
        </div>
        <p style="font-size: 0.82rem">
          © 2026 TIDEF ITECH — Makurdi, Benue State
        </p>
      </div>

      <div class="auth-form-side">
        <div class="auth-form-wrap">
          <div class="eyebrow">NEW PASSWORD</div>
          <h1>Reset your password</h1>
          <p class="sub" id="sub-text">
            Open the secure link from your email to choose a new password.
          </p>

          <div id="form-alert"></div>

          <form id="reset-form" novalidate class="hidden">
            <div class="field">
              <label for="password">New password</label>
              <input
                class="input"
                type="password"
                id="password"
                required
                minlength="8"
                autocomplete="new-password"
              />
            </div>
            <div class="field">
              <label for="confirmPassword">Confirm new password</label>
              <input
                class="input"
                type="password"
                id="confirmPassword"
                required
                minlength="8"
                autocomplete="new-password"
              />
            </div>
            <button
              type="submit"
              class="btn btn-primary btn-block"
              id="reset-btn"
            >
              Set New Password
            </button>
          </form>

          <p class="switch-link">
            <a href="./login.html">&larr; Back to log in</a>
          </p>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        setNewPassword,
        getUserProfile,
        getFreshUser,
      } from "./js/auth.js";
      import { ROLE_HOME_PAGE } from "./js/config.js";
      import {
        setButtonLoading,
        setFieldError,
        clearFieldError,
      } from "./js/utils.js";

      const form = document.getElementById("reset-form");
      const alertBox = document.getElementById("form-alert");
      const resetBtn = document.getElementById("reset-btn");
      const subText = document.getElementById("sub-text");

      function showError(message) {
        const errorAlert = document.createElement("div");
        errorAlert.className = "alert alert-danger";
        errorAlert.textContent = message;
        alertBox.replaceChildren(errorAlert);
      }

      async function finishReset(user) {
        alertBox.innerHTML = `<div class="alert alert-success">Password updated! Redirecting…</div>`;
        const profile = await getUserProfile(user.id);
        setTimeout(() => {
          if (
            profile?.role === "student" &&
            profile.account_status !== "approved"
          ) {
            window.location.href = "./student/pending-approval.html";
          } else {
            window.location.href =
              ROLE_HOME_PAGE[profile?.role] || "./student/dashboard.html";
          }
        }, 1200);
      }

      (async () => {
        const user = await getFreshUser();
        if (user) {
          form.classList.remove("hidden");
          subText.textContent =
            "Your email has been verified. Enter a new password below.";
        } else {
          alertBox.innerHTML =
            '<div class="alert alert-warning">This reset link is invalid or expired. <a href="./forgot-password.html">Request a new reset link</a>.</div>';
        }
      })();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.innerHTML = "";
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        clearFieldError(password);
        clearFieldError(confirmPassword);

        if (password.value.length < 8) {
          setFieldError(password, "Use at least 8 characters.");
          return;
        }
        if (password.value !== confirmPassword.value) {
          setFieldError(confirmPassword, "Passwords don't match.");
          return;
        }

        setButtonLoading(resetBtn, true, "Saving…");
        try {
          const user = await setNewPassword(password.value);
          if (!user) {
            throw new Error(
              "The password was updated, but we couldn't load your account. Please log in with your new password.",
            );
          }
          await finishReset(user);
        } catch (err) {
          showError(
            err.message ||
              "Couldn't update your password. Request a new reset link and try again.",
          );
          setButtonLoading(resetBtn, false);
        }
      });
    </script>
  </body>
</html>
