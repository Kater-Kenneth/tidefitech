<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Reset Password | TIDEF ITECH LMS</title>
    <link
      rel="icon"
      href="https://www.tidefitech.com/img/Capture-removebg-preview.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-visual">
        <div class="brand">
          <img
            src="https://www.tidefitech.com/img/Capture-removebg-preview.png"
            alt="TIDEF ITECH"
          />
          <span class="brand-name">TIDEF ITECH LMS</span>
        </div>
        <div>
          <h2>Forgot your password? No problem.</h2>
          <p>
            Enter your account email and we'll send you a secure reset link.
          </p>
        </div>
        <p style="font-size: 0.82rem">
          © 2026 TIDEF ITECH — Makurdi, Benue State
        </p>
      </div>

      <div class="auth-form-side">
        <div class="auth-form-wrap">
          <div class="eyebrow">RESET PASSWORD</div>
          <h1>Reset your password</h1>
          <p class="sub">We'll email you a link to choose a new password.</p>

          <div id="form-alert"></div>

          <form id="reset-form" novalidate>
            <div class="field">
              <label for="email">Email address</label>
              <input
                class="input"
                type="email"
                id="email"
                required
                autocomplete="email"
              />
            </div>
            <button
              type="submit"
              class="btn btn-primary btn-block"
              id="reset-btn"
            >
              Send reset link
            </button>
          </form>

          <p class="switch-link">
            <a href="./login.html">&larr; Back to log in</a>
          </p>
        </div>
      </div>
    </div>

    <script type="module">
      import { requestPasswordReset } from "./js/auth.js";
      import { setButtonLoading } from "./js/utils.js";

      const form = document.getElementById("reset-form");
      const alertBox = document.getElementById("form-alert");
      const resetBtn = document.getElementById("reset-btn");

      function showAlert(kind, message) {
        const alert = document.createElement("div");
        alert.className = `alert alert-${kind}`;
        alert.textContent = message;
        alertBox.replaceChildren(alert);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.replaceChildren();
        const email = document.getElementById("email").value.trim();

        if (!email) {
          showAlert("warning", "Enter your email address.");
          return;
        }

        setButtonLoading(resetBtn, true, "Sending…");
        try {
          await requestPasswordReset(email);
          showAlert(
            "success",
            "If an account exists for that email, a password reset link has been sent. Open the link in your email to choose a new password.",
          );
          form.reset();
        } catch (err) {
          const timedOut =
            err.status === 504 || /\b504\b/.test(err.message || "");
          const message = timedOut
            ? "The reset email service timed out. Check your inbox before trying again; if no link arrives, contact support."
            : err.message ||
              "We couldn't send the reset link right now. Please try again.";
          showAlert("danger", message);
        } finally {
          setButtonLoading(resetBtn, false);
        }
      });
    </script>
  </body>
</html>
