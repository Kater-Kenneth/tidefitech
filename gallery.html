		<!-- Lightbox -->
		<div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
			<button id="lb-close" class="absolute top-6 right-6 text-white text-2xl">&times;</button>
			<img id="lb-img" src="" alt="">
			<div id="lb-title" class="absolute bottom-6 text-white text-center w-full"></div>
		</div>

		<script>
			// simple lightbox
			document.querySelectorAll('button[data-src]').forEach(btn=>{
				btn.addEventListener('click',()=>{
					const src=btn.getAttribute('data-src');
					const title=btn.getAttribute('data-title')||'';
					document.getElementById('lb-img').src=src;
					document.getElementById('lb-title').textContent=title;
					document.getElementById('lightbox').classList.add('open');
				})
			})
			document.getElementById('lb-close').addEventListener('click',()=>document.getElementById('lightbox').classList.remove('open'))
			document.getElementById('lightbox').addEventListener('click',(e)=>{ if(e.target.id==='lightbox') document.getElementById('lightbox').classList.remove('open')})
		</script>
	</body>
